# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build, test and deploy Web App

on:
  push:
    branches:
      - master
  
env:
  # Path to the solution file relative to the root of the project.
  SOLUTION_FILE_PATH: .

  # Configuration type to build.
  # You can convert this to a build matrix if you need coverage of multiple configuration types.
  # https://docs.github.com/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
  BUILD_CONFIGURATION: Release

permissions:
  contents: write
  
jobs:
  build-release:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v1.0.2

    - name: Restore NuGet packages
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: nuget restore ${{env.SOLUTION_FILE_PATH}}

    - name: Build
      working-directory: ${{env.GITHUB_WORKSPACE}}
      # Add additional options to the MSBuild command line here (like platform or verbosity level).
      # See https://docs.microsoft.com/visualstudio/msbuild/msbuild-command-line-reference
      run: msbuild /m /p:Configuration=${{env.BUILD_CONFIGURATION}} ${{env.SOLUTION_FILE_PATH}}/MyId/MyIdApp.csproj

    - name: Zip files
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: Compress-Archive -Path ${{env.SOLUTION_FILE_PATH}}/MyId/bin/Release/* -Destination ${{env.SOLUTION_FILE_PATH}}/MyId/bin/MyIdFiles.zip
    
    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # This token is provided by Actions, you do not need to create your own token
      with:
        tag_name: ${{ github.run_number }}
        release_name: Release ${{ github.run_number }}
        body: |
          Built by Github Actions
        draft: false
        prerelease: false
    
    - name: Upload Release Asset
      uses: actions/upload-release-asset@v1.0.1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ${{env.SOLUTION_FILE_PATH}}/MyId/bin/MyIdFiles.zip
        asset_name: MyIdFiles.zip
        asset_content_type: application/zip
        
  WebApi_buildImage:
    runs-on: windows-latest
    needs: build-release
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Build with dotnet
        run: dotnet build ./WebApi/WebApi.csproj --configuration Release

      - name: Test
        run: dotnet test ./TestProject1/TestProject1.csproj -e ConnectionString="No Github DB Yet"

      - name: dotnet publish
        run: dotnet publish ./WebApi/WebApi.csproj -c Release -o "${{env.DOTNET_ROOT}}\WebApi"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-api
          path: ${{env.DOTNET_ROOT}}\WebApi
  WebFrontEnd_buildImage:
    runs-on: windows-latest
    needs: WebApi_deploy
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Build with dotnet
        run: dotnet build ./MyIdWeb/MyIdCloud.csproj --configuration Release

      - name: dotnet publish
        run: dotnet publish ./MyIdWeb/MyIdCloud.csproj -c Release -o "${{env.DOTNET_ROOT}}\MyIdCloud"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v3
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}\MyIdCloud
  
  WebApi_deploy:
    runs-on: windows-latest
    needs: WebApi_buildImage
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapi.outputs.webapp-url }}

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-api
          path: WebApi

      - name: Deploy to Azure Web Api
        id: deploy-to-webapi
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'myidcloudapi'
          slot-name: 'Production'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_B7BD54D3A53C4AFEBD0A2F46BF601E77 }}
          package: ./WebApi
  WebFrontEnd_deploy:
    runs-on: windows-latest
    needs: WebFrontEnd_buildImage
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v3
        with:
          name: .net-app

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'myidcloud'
          slot-name: 'Production'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_B7BD54D3A53C4AFEBD0A2F46BF601E76 }}
          package: .
